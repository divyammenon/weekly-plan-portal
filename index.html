<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AL Noaimeyah Girls School — Weekly Plan Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<!-- Firebase (free tier) — provides the shared database so teachers, admin, and
     students all see the same data from any device, anywhere with internet. -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    --ink:#3d2f22;          /* deep espresso brown — text */
    --paper:#f2e8d5;        /* warm beige — page background */
    --card:#fffaf0;         /* creamy ivory — cards */
    --rail:#ddccA6;         /* soft beige border */
    --accent:#c9a227;       /* gold — stars & highlights */
    --accent-ink:#7a5c14;
    --primary:#8a6d3b;      /* bronze/olive — primary buttons */
    --primary-deep:#6b5228;
    --coral:#a8452c;        /* rust — missing / alert */
    --coral-soft:#f2ddd2;
    --success-soft:#e4e6c9; /* sage-beige — posted status */
    --success-ink:#55642f;
    --shadow: 0 6px 18px rgba(61,47,34,0.12);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 10% -10%, #faf3e2 0%, transparent 60%),
      radial-gradient(900px 500px at 100% 100%, #f5e9c9 0%, transparent 55%),
      repeating-linear-gradient(135deg, rgba(201,162,39,0.05) 0px, rgba(201,162,39,0.05) 2px, transparent 2px, transparent 26px),
      var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:28px 16px 60px;
    position:relative;
    overflow-x:hidden;
  }
  .bg-stickers{
    position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;
  }
  .bg-stickers span{
    position:absolute;font-size:64px;opacity:.08;filter:grayscale(15%);
  }
  .bg-stickers span:nth-child(1){top:4%;left:3%;transform:rotate(-14deg);font-size:70px;}
  .bg-stickers span:nth-child(2){top:8%;right:4%;transform:rotate(12deg);}
  .bg-stickers span:nth-child(3){bottom:6%;left:5%;transform:rotate(8deg);font-size:76px;}
  .bg-stickers span:nth-child(4){bottom:10%;right:6%;transform:rotate(-10deg);}
  .bg-stickers span:nth-child(5){top:42%;left:1%;transform:rotate(-6deg);font-size:56px;}
  .bg-stickers span:nth-child(6){top:55%;right:1%;transform:rotate(10deg);font-size:56px;}
  .wrap{max-width:980px;margin:0 auto;position:relative;z-index:1;}

  /* Header */
  header{
    display:flex;flex-direction:column;align-items:center;text-align:center;
    gap:14px;margin-bottom:8px;
  }
  .brand{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .brand-mark{
    width:62px;height:62px;border-radius:16px;
    background:linear-gradient(155deg,var(--accent),var(--accent-ink));
    display:flex;align-items:center;justify-content:center;
    font-size:30px;box-shadow:var(--shadow);flex-shrink:0;
  }
  h1{
    font-family:'Baloo 2',sans-serif;font-weight:800;
    font-size:25px;margin:0;letter-spacing:0.3px;color:var(--ink);
  }
  .sub{margin:3px 0 0;color:var(--primary-deep);font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;}
  .sub2{margin:2px 0 0;color:#8a7a63;font-size:12.5px;}
  .sticker-strip{font-size:19px;letter-spacing:6px;opacity:.75;margin:4px 0 2px;}

  nav.roles{display:flex;gap:8px;background:#e8dcbf;padding:5px;border-radius:12px;margin-bottom:14px;}
  nav.roles button{
    border:none;background:transparent;padding:9px 16px;border-radius:9px;
    font-family:'Baloo 2',sans-serif;font-weight:700;font-size:14px;color:#7a6a4f;
    cursor:pointer;transition:.15s;
  }
  nav.roles button.active{background:var(--card);color:var(--ink);box-shadow:var(--shadow);}
  nav.roles button[data-role="teacher"].active{background:#f6e4ab;color:#7a5c14;}
  nav.roles button[data-role="admin"].active{background:#f2ddd2;color:#a8452c;}
  nav.roles button[data-role="student"].active{background:#e0e8c8;color:#4f6b2f;}

  /* Week strip */
  .week-bar{
    display:flex;align-items:center;justify-content:center;gap:14px;
    margin:18px 0 22px;
  }
  .week-bar button{
    width:34px;height:34px;border-radius:50%;border:1.5px solid var(--rail);
    background:var(--card);cursor:pointer;font-size:15px;color:var(--ink);
    display:flex;align-items:center;justify-content:center;
  }
  .week-bar button:hover{border-color:var(--primary);color:var(--primary-deep);}
  .week-label{
    font-family:'JetBrains Mono',monospace;font-weight:500;font-size:13.5px;
    background:var(--card);padding:8px 16px;border-radius:999px;box-shadow:var(--shadow);
    color:var(--primary-deep);
  }

  .card{
    background:var(--card);border-radius:16px;box-shadow:var(--shadow);
    padding:22px 24px;margin-bottom:18px;border:1px solid #f0e6cf;
  }
  .card-gold{border-left:5px solid var(--accent);}
  .card-rust{border-left:5px solid var(--coral);}
  .card-sage{border-left:5px solid #7c8c4a;}
  .card-primary{border-left:5px solid var(--primary);}
  .card h2{
    font-family:'Baloo 2',sans-serif;font-size:18px;margin:0 0 14px;
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  }
  label{font-size:12.5px;font-weight:600;color:#8a7a63;display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em;}
  select,input[type=text],textarea{
    width:100%;border:1.5px solid var(--rail);border-radius:10px;padding:9px 11px;
    font-family:'Inter',sans-serif;font-size:14px;color:var(--ink);background:#fffdf7;
    resize:vertical;
  }
  select:focus,input:focus,textarea:focus{outline:2px solid var(--primary);outline-offset:1px;border-color:var(--primary);}
  .row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
  .row>div{flex:1;min-width:160px;}

  .btn{
    font-family:'Baloo 2',sans-serif;font-weight:700;font-size:14px;
    border:none;border-radius:10px;padding:10px 18px;cursor:pointer;transition:.15s;
  }
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-primary:hover{background:var(--primary-deep);}
  .btn-ghost{background:transparent;color:var(--coral);border:1.5px solid var(--coral-soft);}
  .btn-ghost:hover{background:var(--coral-soft);}
  .btn-sm{padding:6px 12px;font-size:12.5px;}

  /* Star of the Week */
  .star-banner{
    background:linear-gradient(90deg,#fbf1cf,#f6e4ab);
    border:2px solid var(--accent);border-radius:14px;
    padding:14px 18px;margin-bottom:10px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    font-family:'Baloo 2',sans-serif;font-weight:800;font-size:17px;color:var(--accent-ink);
    text-align:center;letter-spacing:.02em;line-height:1.5;
  }

  /* Timetable — signature element */
  .timetable{
    display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));gap:10px;
    overflow-x:auto;padding-bottom:4px;
  }
  .day-col{
    background:#fdf8ec;border:1.5px solid var(--rail);border-radius:12px;
    padding:12px;min-width:150px;
  }
  .day-col .day-name{
    font-family:'Baloo 2',sans-serif;font-weight:700;font-size:13px;
    color:var(--primary-deep);margin-bottom:8px;border-bottom:2px dashed var(--rail);padding-bottom:6px;
  }
  .day-col textarea{min-height:54px;font-size:13px;margin-bottom:8px;}
  .day-col textarea:last-child{margin-bottom:0;}
  .day-col .field-tag{font-size:10px;color:#8a7a63;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px;display:block;}

  .status-pill{
    display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;
    font-size:12px;font-weight:600;
  }
  .status-pill.ok{background:var(--success-soft);color:var(--success-ink);}
  .status-pill.missing{background:var(--coral-soft);color:var(--coral);}

  /* Admin register table */
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{
    text-align:left;font-family:'Baloo 2',sans-serif;font-size:12px;text-transform:uppercase;
    letter-spacing:.03em;color:#8a7a63;padding:8px 10px;border-bottom:2px solid var(--rail);
  }
  td{padding:10px;border-bottom:1px solid #f0e6cf;vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .teacher-name{font-weight:600;}
  .class-chip{
    background:#f2e8d5;border-radius:6px;padding:2px 8px;font-size:12px;color:#7a6a4f;
    font-family:'JetBrains Mono',monospace;
  }

  .class-block{
    border:1.5px solid var(--rail);border-radius:12px;padding:12px 16px;margin-bottom:10px;background:#fffdf7;
  }
  .class-block summary{
    cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;
    font-family:'Baloo 2',sans-serif;font-weight:700;font-size:14.5px;list-style:none;
  }
  .class-block summary::-webkit-details-marker{display:none;}
  .class-block summary::before{content:'▸';color:#8a7a63;margin-right:6px;transition:.15s;}
  .class-block[open] summary::before{transform:rotate(90deg);display:inline-block;}
  .class-block table{margin-top:12px;}
  .empty{
    text-align:center;padding:40px 20px;color:#9a8a70;font-size:14px;
  }
  .empty .big{font-size:34px;display:block;margin-bottom:8px;}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:11px 20px;border-radius:10px;font-size:13.5px;
    font-family:'Baloo 2',sans-serif;font-weight:600;box-shadow:var(--shadow);
    opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}
  .hint{font-size:12px;color:#9a8a70;margin-top:6px;}
  @media(max-width:640px){
    nav.roles{width:100%;}
    nav.roles button{flex:1;}
  }

  /* Printing — hidden on screen, shown only in the print dialog */
  #printArea{display:none;}
  @media print{
    body{background:#fff;}
    body > *:not(#printArea){display:none !important;}
    #printArea{display:block !important;}
    .print-header{text-align:center;border-bottom:3px solid #c9a227;padding-bottom:8px;margin-bottom:12px;}
    .print-header h1{font-family:'Baloo 2',sans-serif;font-size:19px;margin:0;letter-spacing:.03em;color:#3d2f22;}
    .print-header .print-cycle{font-family:'JetBrains Mono',monospace;font-size:11px;color:#7a6a4f;margin:2px 0 0;letter-spacing:.08em;}
    .print-class-title{font-family:'Baloo 2',sans-serif;font-size:16px;margin:0 0 2px;color:#3d2f22;}
    .print-sub{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#6b5b45;margin:0 0 12px;}
    .print-table{width:100%;border-collapse:collapse;font-size:10.5px;table-layout:fixed;}
    .print-table th,.print-table td{border:1px solid #b8a878;padding:6px 7px;text-align:left;vertical-align:top;word-wrap:break-word;}
    .print-table th{background:#f2e8d5;font-family:'Baloo 2',sans-serif;color:#3d2f22;}
    .print-table tr{page-break-inside:avoid;}
    .print-empty{color:#999;text-align:center;}
    .print-teacher{font-weight:400;color:#7a6a4f;font-size:9.5px;text-transform:uppercase;letter-spacing:.02em;}
    .print-star{font-weight:400;color:#7a5c14;font-size:9px;}
    .print-star-box{
      text-align:center;background:#fbf1cf;border:2px solid #c9a227;border-radius:10px;
      padding:10px 14px;margin:0 0 14px;
    }
    .print-star-title{font-family:'Baloo 2',sans-serif;font-size:15px;font-weight:800;color:#7a5c14;letter-spacing:.05em;margin-bottom:4px;text-align:center;}
    .print-star-line{font-family:'Baloo 2',sans-serif;font-size:13px;color:#5c4a1a;margin:2px 0;}
    .print-star-columns{display:flex;align-items:stretch;justify-content:center;gap:12px;margin-top:6px;}
    .print-star-col{flex:1;text-align:center;}
    .print-star-divider{
      display:flex;align-items:center;justify-content:center;
      width:2px;background:#c9a227;position:relative;
    }
    .print-star-divider span{
      position:absolute;background:#fbf1cf;font-size:17px;padding:2px 0;
    }
  }
</style>
</head>
<body>
<div class="bg-stickers" aria-hidden="true">
  <span>📚</span><span>🎨</span><span>✏️</span><span>🌟</span><span>🔬</span><span>🎒</span>
</div>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="brand-mark">🏫</div>
      <div>
        <h1>AL NOAIMEYAH GIRLS SCHOOL</h1>
        <p class="sub">CYCLE 1 &nbsp;•&nbsp; CYCLE 2 &nbsp;•&nbsp; CYCLE 3</p>
        <p class="sub2">Weekly Plan Board — teachers post it, admin tracks it, students read it.</p>
        <p class="sticker-strip">📚 ✏️ 🎨 🔬 🎵 ⚽ 🌍 🤖</p>
      </div>
    </div>
    <nav class="roles">
      <button data-role="teacher" class="active">🧑‍🏫 Teacher</button>
      <button data-role="admin">🛡️ Admin</button>
      <button data-role="student">🎒 Student</button>
    </nav>
  </header>

  <div class="week-bar">
    <button id="prevWeek">‹</button>
    <div class="week-label" id="weekLabel">—</div>
    <button id="nextWeek">›</button>
  </div>

  <div id="app"></div>
</div>
<div class="toast" id="toast"></div>
<div id="printArea"></div>

<script>

};

const db = firebase.firestore();
/* ============================================================ */

const DAYS = [['mon','Mon'],['tue','Tue'],['wed','Wed'],['thu','Thu'],['fri','Fri']];
const CLASS_STRUCTURE = [
  {grade:'Grade 1', classes:['1-1','1-2']},
  {grade:'Grade 2', classes:['2-1','2-2','2-3']},
  {grade:'Grade 3', classes:['3-1','3-2']},
  {grade:'Grade 4', classes:['4-1','4-2']},
  {grade:'Grade 5', classes:['Grade 5']},
  {grade:'Grade 6', classes:['Grade 6']},
  {grade:'Grade 7', classes:['7-1','7-2']},
  {grade:'Grade 8', classes:['Grade 8']},
  {grade:'Grade 9', classes:['9 GEN','9 ADV']},
  {grade:'Grade 10', classes:['10 GEN','10 ADV']},
  {grade:'Grade 11', classes:['11 GEN','11 ADV']},
  {grade:'Grade 12', classes:['12 GEN1','12 ADV']}
];
function classOptionsHtml(){
  return CLASS_STRUCTURE.map(g=>`
    <optgroup label="${g.grade}">
      ${g.classes.map(c=>`<option value="${c}">${c}</option>`).join('')}
    </optgroup>
  `).join('');
}
const ALL_CLASSES = CLASS_STRUCTURE.flatMap(g=>g.classes);
const GRADE1_TO_8 = CLASS_STRUCTURE.slice(0,8).flatMap(g=>g.classes);
const GRADE1_TO_2 = CLASS_STRUCTURE.slice(0,2).flatMap(g=>g.classes);
const GRADE5_TO_12 = CLASS_STRUCTURE.slice(4).flatMap(g=>g.classes);
/* Music/Arts and AI & Technology don't run in every class — built from the
   actual staffing list rather than a blanket "all classes" rule. */
const MUSIC_ARTS_CLASSES = [...GRADE1_TO_8, '9 GEN', '9 ADV', '10 GEN'];
const AI_TECH_CLASSES = ALL_CLASSES.filter(c => c !== '11 ADV' && c !== '12 ADV');

/* Single source of truth for each subject's display name (English + Arabic).
   SUBJECT_CLASS_MAP and TEACHER_DIRECTORY both reference these constants
   instead of retyping the string, so editing the Arabic text here updates
   everywhere at once and can never fall out of sync again. */
const SUBJ = {
  ENGLISH: 'ENGLISH انجلش ',
  ARABIC: 'ARABIC اللغة العربية  ',
  ISLAMIC: 'ISLAMIC  إسلامية ',
  MATHEMATICS: 'MATHEMATICSالرياضيات ',
  PE: 'PE الرياضة ',
  SOCIAL_STUDIES: 'SOCIAL STUDIES اجتماعيات ',
  AI_TECH: 'AI AND TECHNOLOGY',
  ACTIVITY: 'ACTIVITY حصة النشاط ',
  MUSIC: 'MUSIC موسيقى ',
  ARTS: 'ARTS فنية ',
  SCIENCE: 'SCIENCE علوم ',
  FRENCH: 'FRENCH اللغة الفرنسية  ',
  HEALTH_SCIENCE: 'HEALTH SCIENCE العلوم الصحية  ',
  PHYSICS: 'PHYSICS الفيزياء ',
  BIOLOGY: 'BIOLOGY الاحياء ',
  CHEMISTRY: 'CHEMISTRY كيمياء '
};

const SUBJECT_CLASS_MAP = {
  [SUBJ.ENGLISH]: ALL_CLASSES,
  [SUBJ.ARABIC]: ALL_CLASSES,
  [SUBJ.ISLAMIC]: ALL_CLASSES,
  [SUBJ.MATHEMATICS]: ALL_CLASSES,
  [SUBJ.PE]: ALL_CLASSES,
  [SUBJ.SOCIAL_STUDIES]: ALL_CLASSES,
  [SUBJ.AI_TECH]: AI_TECH_CLASSES,
  [SUBJ.ACTIVITY]: GRADE1_TO_2,
  [SUBJ.MUSIC]: MUSIC_ARTS_CLASSES,
  [SUBJ.ARTS]: MUSIC_ARTS_CLASSES,
  [SUBJ.SCIENCE]: [...GRADE1_TO_8, '9 GEN', '10 GEN'],
  [SUBJ.FRENCH]: GRADE5_TO_12,
  [SUBJ.HEALTH_SCIENCE]: ['11 GEN','12 GEN1','12 ADV'],
  [SUBJ.PHYSICS]: ['9 ADV','10 ADV','11 ADV','12 GEN1','12 ADV'],
  [SUBJ.BIOLOGY]: ['9 ADV','11 GEN','11 ADV','12 GEN1','12 ADV'],
  [SUBJ.CHEMISTRY]: ['10 ADV','11 GEN','11 ADV','12 GEN1','12 ADV']
};
const SUBJECTS = Object.keys(SUBJECT_CLASS_MAP);
function subjectsForClass(className){
  return SUBJECTS.filter(s=>SUBJECT_CLASS_MAP[s].includes(className));
}
/* Suggested teacher name per class+subject — auto-fills the "Your name" box
   on the teacher form (teachers can still overwrite it). Add more with
   setTeacher(['class-id', ...], SUBJ.XXX, 'Name'). */
const TEACHER_DIRECTORY = {};
function setTeacher(classes, subject, name){
  if(!name) return;
  classes.forEach(c=>{ TEACHER_DIRECTORY[planEntryKey(c, subject)] = name; });
}
setTeacher(['1-1','1-2'], SUBJ.ISLAMIC, 'Jamila');
setTeacher(['1-1','1-2'], SUBJ.MATHEMATICS, 'Nahla');
setTeacher(['1-1','1-2'], SUBJ.SCIENCE, 'Nahla');
setTeacher(['1-1','1-2'], SUBJ.ENGLISH, 'SOMYAH');
setTeacher(['1-1','1-2'], SUBJ.ARABIC, 'Jamila');
setTeacher(['1-1','1-2'], SUBJ.PE, 'Yasmina');
setTeacher(['1-1','1-2'], SUBJ.AI_TECH, 'Nadiya');
setTeacher(['1-1','1-2'], SUBJ.MUSIC, 'anan');
setTeacher(['1-1','1-2'], SUBJ.ARTS, 'heba');
setTeacher(['1-1','1-2'], SUBJ.SOCIAL_STUDIES, 'eman');
setTeacher(GRADE1_TO_2, SUBJ.ACTIVITY, 'Mona A');

setTeacher(['2-1','2-2'], SUBJ.ISLAMIC, 'Eman');
setTeacher(['2-1','2-2'], SUBJ.MATHEMATICS, 'Mona A');
setTeacher(['2-1','2-2'], SUBJ.SCIENCE, 'Mona A');
setTeacher(['2-1','2-2'], SUBJ.ENGLISH, 'Nassra');
setTeacher(['2-1','2-2'], SUBJ.ARABIC, 'Hamda');
setTeacher(['2-1','2-2'], SUBJ.PE, 'Yasmina');
setTeacher(['2-1','2-2'], SUBJ.AI_TECH, 'Nadiya');
setTeacher(['2-1','2-2'], SUBJ.MUSIC, 'anan');
setTeacher(['2-1','2-2'], SUBJ.ARTS, 'heba');

setTeacher(['2-3'], SUBJ.ISLAMIC, 'Eman');

setTeacher(['2-3'], SUBJ.PE, 'Yasmina');
setTeacher(['2-3'], SUBJ.AI_TECH, 'Nadiya');
setTeacher(['2-3'], SUBJ.MUSIC, 'anan');
setTeacher(['2-3'], SUBJ.ARTS, 'heba');
setTeacher(['2-3'], SUBJ.SOCIAL_STUDIES, 'Moza H');

setTeacher(['3-1','3-2'], SUBJ.ISLAMIC, 'Aishah');
setTeacher(['3-1','3-2'], SUBJ.MATHEMATICS, 'SAMIRA');
setTeacher(['3-1','3-2'], SUBJ.SCIENCE, 'Laila M.');
setTeacher(['3-1','3-2'], SUBJ.ENGLISH, 'somyah');
setTeacher(['3-1','3-2'], SUBJ.ARABIC, 'mariam M.');
setTeacher(['3-1','3-2'], SUBJ.PE, 'Hayam');
setTeacher(['3-1','3-2'], SUBJ.AI_TECH, 'nadiya');
setTeacher(['3-1','3-2'], SUBJ.MUSIC, 'anan');
setTeacher(['3-1','3-2'], SUBJ.ARTS, 'heba');

function subjectOptionsHtml(className){
  return subjectsForClass(className).map(s=>`<option value="${s}">${s}</option>`).join('');
}

function toDateStr(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function mondayOf(d){
  const date = new Date(d);
  const day = date.getDay();
  const diff = (day === 0 ? -6 : 1) - day;
  date.setDate(date.getDate() + diff);
  date.setHours(0,0,0,0);
  return toDateStr(date);
}
function addDays(dateStr, n){
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return toDateStr(d);
}
function weekLabelText(ws){
  const start = new Date(ws + 'T00:00:00');
  const end = new Date(addDays(ws,4) + 'T00:00:00');
  const opts = {month:'short', day:'numeric'};
  const startStr = start.toLocaleDateString('en-US', opts);
  const endStr = end.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
  return `${startStr} – ${endStr}`;
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}
function slug(str){ return str.replace(/\s+/g,'_').toUpperCase(); }
function planEntryKey(className, subject){ return `${slug(className)}__${slug(subject)}`; }
function legacyPlanKey(className, subject, ws){ return `plan:${slug(className)}:${slug(subject)}:${ws}`; }
function emptyPlan(){
  return { teacherName:'', starOfWeek:'', days:{mon:{topic:'',homework:''},tue:{topic:'',homework:''},wed:{topic:'',homework:''},thu:{topic:'',homework:''},fri:{topic:'',homework:''}}, submittedAt:null };
}

/* All of one week's plans live in a single Firestore document
   (one field per class+subject) instead of one document each —
   this turns ~130 reads into 1 for the admin dashboard, and lets
   switching class/subject on the teacher & student screens read
   from an in-memory cache instead of hitting the network again. */
let weekPlansCache = null;
let weekPlansCacheWeek = null;
async function loadWeekPlans(ws){
  if(weekPlansCacheWeek === ws && weekPlansCache) return weekPlansCache;
  try{
    const doc = await db.collection('plans').doc(ws).get();
    weekPlansCache = doc.exists ? doc.data() : {};
  }catch(e){ console.error('loadWeekPlans failed:', e); weekPlansCache = {}; }
  weekPlansCacheWeek = ws;
  return weekPlansCache;
}
async function loadPlan(className, subject, ws){
  const key = planEntryKey(className, subject);
  const weekPlans = await loadWeekPlans(ws);
  if(weekPlans[key]) return weekPlans[key];
  /* Fallback for plans posted before this update, stored one-per-document.
     If found, migrate it into the fast per-week document for next time. */
  try{
    const legacyDoc = await db.collection('plans').doc(legacyPlanKey(className, subject, ws)).get();
    if(legacyDoc.exists){
      const data = legacyDoc.data();
      weekPlans[key] = data;
      db.collection('plans').doc(ws).set({[key]: data}, {merge:true}).catch(()=>{});
      return data;
    }
  }catch(e){ /* no legacy plan either — genuinely nothing posted yet */ }
  return null;
}
async function savePlan(className, subject, ws, plan){
  const key = planEntryKey(className, subject);
  await db.collection('plans').doc(ws).set({[key]: plan}, {merge:true});
  if(weekPlansCacheWeek === ws && weekPlansCache) weekPlansCache[key] = plan;
}
async function loadSettings(){
  try{
    const doc = await db.collection('settings').doc('main').get();
    return doc.exists ? doc.data() : {teacherPin:'1234', adminPin:'2026'};
  }catch(e){ console.error('loadSettings failed:', e); return {teacherPin:'1234', adminPin:'2026'}; }
}
async function saveSettings(settings){
  await db.collection('settings').doc('main').set(settings);
}
let teacherUnlocked = false;
let adminUnlocked = false;

function render(){
  document.getElementById('weekLabel').textContent = weekLabelText(weekStart);
  const app = document.getElementById('app');
  if(role === 'teacher') renderTeacher(app);
  else if(role === 'admin') renderAdmin(app);
  else renderStudent(app);
}

async function renderTeacher(app){
  if(!teacherUnlocked){
    app.innerHTML = `
      <div class="card card-rust">
        <h2>🔒 Teacher access</h2>
        <p class="hint" style="margin-bottom:12px;">Enter the teacher PIN to post or edit a weekly plan. Ask your admin if you don't have it.</p>
        <div class="row">
          <div><input type="text" id="pinInput" placeholder="PIN" style="letter-spacing:3px;"></div>
          <div style="flex:0 0 auto;"><button class="btn btn-primary" id="pinSubmit">Unlock</button></div>
        </div>
      </div>
    `;
    const tryUnlock = async ()=>{
      const settings = await loadSettings();
      const entered = document.getElementById('pinInput').value.trim();
      if(entered && entered === (settings.teacherPin || '1234')){
        teacherUnlocked = true;
        render();
      }else{
        toast('Incorrect PIN');
      }
    };
    document.getElementById('pinSubmit').onclick = tryUnlock;
    document.getElementById('pinInput').onkeydown = (e)=>{ if(e.key==='Enter') tryUnlock(); };
    return;
  }
  if(!subjectsForClass(currentClass).includes(currentSubject)){
    currentSubject = subjectsForClass(currentClass)[0];
  }
  app.innerHTML = `<div class="card empty"><span class="big">⏳</span>Loading…</div>`;
  const plan = (await loadPlan(currentClass, currentSubject, weekStart)) || emptyPlan();
  const assignedTeacher = TEACHER_DIRECTORY[planEntryKey(currentClass, currentSubject)] || null;

  app.innerHTML = `
    <div class="card card-primary">
      <h2>🗓️ Select your class & subject</h2>
      <div class="row">
        <div>
          <label>Class</label>
          <select id="classSelect">${classOptionsHtml().replace(`value="${currentClass}"`, `value="${currentClass}" selected`)}</select>
        </div>
        <div>
          <label>Subject</label>
          <select id="subjectSelect">${subjectsForClass(currentClass).map(s=>`<option value="${s}" ${s===currentSubject?'selected':''}>${s}</option>`).join('')}</select>
        </div>
      </div>
    </div>

    <div class="card card-gold">
      <h2>⭐ Star of the Week  نجم الأسبوع </h2>
      <input type="text" id="starOfWeek" dir="auto" value="${plan.starOfWeek?escapeHtml(plan.starOfWeek):''}" placeholder="Type a student's name to celebrate this week">
      <p class="hint">This shows up highlighted with stars before your weekly plan, for admin and students to see.</p>
    </div>

    <div class="card">
      <h2>🗓️ ${currentClass} — ${currentSubject} — Weekly Plan <span class="status-pill ${plan.submittedAt?'ok':'missing'}">${plan.submittedAt?'Posted':'Not posted yet'}</span></h2>
      <div class="row">
        ${assignedTeacher
          ? `<div><label>Teacher</label><p style="font-family:'Baloo 2',sans-serif;font-weight:700;font-size:16px;color:var(--primary-deep);margin:0;text-transform:uppercase;letter-spacing:.03em;">🧑‍🏫 ${escapeHtml(assignedTeacher)}</p></div>`
          : `<div><label>Your name</label><input type="text" id="teacherName" value="${plan.teacherName?escapeHtml(plan.teacherName):''}" placeholder="No teacher on file yet — type your name"></div>`}
      </div>
      <div class="timetable">
        ${DAYS.map(([key,label])=>`
          <div class="day-col">
            <div class="day-name">${label}</div>
            <span class="field-tag">Topic / focus   الدروس  </span>
            <textarea data-day="${key}" data-field="topic" dir="auto" placeholder="What's the lesson?">${plan.days[key]?.topic||''}</textarea>
            <span class="field-tag">Tasks / Exam   الاختبارات </span>
            <textarea data-day="${key}" data-field="homework" dir="auto" placeholder="Any tasks or exams?">${plan.days[key]?.homework||''}</textarea>
          </div>
        `).join('')}
      </div>
      <p class="hint">${plan.submittedAt ? 'Last posted ' + new Date(plan.submittedAt).toLocaleString() : "Students can't see this until you post it."}</p>
      <div style="margin-top:14px;display:flex;gap:10px;">
        <button class="btn btn-primary" id="postPlan">✅ Post this week's plan</button>
      </div>
    </div>
  `;

  document.getElementById('classSelect').onchange = (e)=>{
    currentClass = e.target.value;
    currentSubject = subjectsForClass(currentClass)[0];
    render();
  };
  document.getElementById('subjectSelect').onchange = (e)=>{ currentSubject = e.target.value; render(); };
  document.getElementById('postPlan').onclick = async ()=>{
    const newPlan = emptyPlan();
    newPlan.teacherName = assignedTeacher || document.getElementById('teacherName').value.trim();
    newPlan.starOfWeek = document.getElementById('starOfWeek').value.trim();
    document.querySelectorAll('.day-col textarea[data-day]').forEach(ta=>{
      const day = ta.dataset.day, field = ta.dataset.field;
      newPlan.days[day][field] = ta.value.trim();
    });
    newPlan.submittedAt = new Date().toISOString();
    await savePlan(currentClass, currentSubject, weekStart, newPlan);
    toast('Weekly plan posted ✓');
    render();
  };
}

/* ---------- ADMIN ---------- */
async function buildConsolidated(){
  return Promise.all(ALL_CLASSES.map(async cls=>{
    const subs = subjectsForClass(cls);
    const plans = await Promise.all(subs.map(s=>loadPlan(cls, s, weekStart)));
    return {cls, subs, plans};
  }));
}

  let totalSubs=0, totalPosted=0;
  rows.forEach(r=>{ totalSubs += r.subs.length; totalPosted += r.plans.filter(p=>p && p.submittedAt).length; });
  const missing = totalSubs - totalPosted;

  app.innerHTML = `
    <div class="card card-rust">
      <h2>🔐 Teacher access PIN</h2>
      <p class="hint" style="margin-bottom:12px;">Teachers need this PIN before they can post or edit a weekly plan. Share it only with your teaching staff.</p>

      </div>
    </div>
    <div class="card card-rust">
      <h2>🔒 Admin access PIN</h2>
      <p class="hint" style="margin-bottom:12px;">This is the PIN needed to open this dashboard at all. Keep it private, and change it from the default.</p>
      <div class="row">
        <div><input type="text" id="adminPinField" value="${escapeHtml(settings.adminPin || '2026')}" style="letter-spacing:3px;"></div>
        <div style="flex:0 0 auto;"><button class="btn btn-primary" id="saveAdminPin">Save PIN</button></div>
      </div>
    </div>
    <div class="card card-sage">
      <h2>📋 Consolidated view — week of ${weekLabelText(weekStart)}
        ${missing>0 ? `<span class="status-pill missing">${missing} missing</span>` : `<span class="status-pill ok">All posted 🎉</span>`}
      </h2>
      <p class="hint" style="margin-bottom:12px;">${totalPosted} of ${totalSubs} class-subject plans posted this week. Click a class to see the subject breakdown.</p>
      <button class="btn btn-primary" id="printIncomplete">🚨 Print Incomplete Entries</button>
    </div>
    ${CLASS_STRUCTURE.map(g=>`
      <div class="card card-gold">
        <h2>${g.grade}</h2>
        ${g.classes.map(cls=>{
          const row = byClass[cls];
          const posted = row.plans.filter(p=>p && p.submittedAt).length;
          const total = row.subs.length;
          const allDone = posted === total;
          return `
          <details class="class-block">
            <summary>
              <span class="teacher-name">${cls}</span>
              <span style="display:flex;align-items:center;gap:8px;">
                <span class="status-pill ${allDone?'ok':'missing'}">${posted}/${total} posted</span>

                  const done = p && p.submittedAt;

                    <td>${s}</td>

    if(!newPin){ toast('Enter a PIN first'); return; }
    await saveSettings({...settings, teacherPin:newPin});
    toast('Teacher PIN updated');
  };
  document.getElementById('saveAdminPin').onclick = async ()=>{
    const newPin = document.getElementById('adminPinField').value.trim();
    if(!newPin){ toast('Enter a PIN first'); return; }
    await saveSettings({...settings, adminPin:newPin});
    toast('Admin PIN updated');
  };
  document.getElementById('printIncomplete').onclick = ()=>{ printIncompleteReport(byClass); };
  app.querySelectorAll('[data-print-class]').forEach(btn=>{
    btn.onclick = (e)=>{
      e.preventDefault();
      e.stopPropagation();
      printClassSchedule(btn.dataset.printClass);
    };
  });
  app.querySelectorAll('[data-view-class]').forEach(btn=>{
    btn.onclick = async ()=>{
      const cls = btn.dataset.viewClass, subj = btn.dataset.viewSubject;
      const plan = await loadPlan(cls, subj, weekStart);
      const detail = document.getElementById('planDetail');
      detail.style.display = 'block';
      detail.innerHTML = renderPlanView(cls, subj, plan);
      detail.scrollIntoView({behavior:'smooth', block:'nearest'});
    };
  });
}

/* ---------- STUDENT ---------- */
async function renderStudent(app){
  app.innerHTML = `
    <div class="card card-sage">
      <h2>🎒 Pick your class</h2>
      <div class="row">
        <div><select id="classSelect">${classOptionsHtml()}</select></div>
        <div style="flex:0 0 auto;"><button class="btn btn-primary" id="printBtn">🖨️ Print / Save as PDF</button></div>
      </div>
    </div>
    <div id="studentPlan"></div>
  `;
  document.getElementById('printBtn').onclick = ()=>{
    printClassSchedule(document.getElementById('classSelect').value);
  };
  const showPlan = async ()=>{
    const className = document.getElementById('classSelect').value;
    const subs = subjectsForClass(className);
    const container = document.getElementById('studentPlan');
    container.innerHTML = `<div class="card empty"><span class="big">⏳</span>Loading this week's plan…</div>`;
    const blocks = await Promise.all(subs.map(async s=>{
      const plan = await loadPlan(className, s, weekStart);
      return renderPlanView(className, s, plan);
    }));
    container.innerHTML = blocks.map(b=>`<div class="card">${b}</div>`).join('');
  };
  document.getElementById('classSelect').onchange = showPlan;
  showPlan();
}

function renderPlanView(className, subject, plan){
  if(!plan || !plan.submittedAt){
    return `<h2>${className} — ${subject}</h2><div class="empty"><span class="big">⏳</span>This week's plan isn't posted yet. Check back soon!</div>`;
  }
  return `
    <h2>🗓️ ${className} — ${subject}${plan.teacherName ? ' — <span style="text-transform:uppercase;">' + escapeHtml(plan.teacherName) + '</span>' : ''} <span class="status-pill ok">Posted</span></h2>
    ${plan.starOfWeek ? `<div class="star-banner">🌟✨ STAR OF THE WEEK ✨🌟<br>⭐🎉 ${escapeHtml(plan.starOfWeek)} 🎉⭐</div>` : ''}
    <div class="timetable">
      ${DAYS.map(([key,label])=>`
        <div class="day-col">
          <div class="day-name">${label}</div>
          <span class="field-tag">Topic</span>
          <p dir="auto" style="font-size:13px;margin:0 0 8px;">${plan.days[key]?.topic ? escapeHtml(plan.days[key].topic) : '<em style="color:#aa9a80;">—</em>'}</p>
          <span class="field-tag">Tasks / Exam</span>
          <p dir="auto" style="font-size:13px;margin:0;">${plan.days[key]?.homework ? escapeHtml(plan.days[key].homework) : '<em style="color:#aa9a80;">—</em>'}</p>
        </div>
      `).join('')}
    </div>
  `;
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- PRINT / PDF ---------- */
function starLineHtml(x){
  return `<div class="print-star-line">⭐🎉 <strong>${x.subject}:</strong> ${escapeHtml(x.plan.starOfWeek)} 🎉⭐</div>`;
}
function starBoxHtml(stars){
  if(!stars.length) return '';
  let body;
  if(stars.length >= 6){
    const mid = Math.ceil(stars.length / 2);
    const left = stars.slice(0, mid);
    const right = stars.slice(mid);
    body = `
      <div class="print-star-columns">
        <div class="print-star-col">${left.map(starLineHtml).join('')}</div>
        <div class="print-star-divider"><span>🏆</span></div>
        <div class="print-star-col">${right.map(starLineHtml).join('')}</div>
      </div>`;
  }else{
    body = stars.map(starLineHtml).join('');
  }
  return `
    <div class="print-star-box">
      <div class="print-star-title">🌟✨ STAR OF THE WEEK ✨🌟</div>
      ${body}
    </div>`;
}
function printIncompleteReport(byClass){
  let anyMissing = false;
  const sections = CLASS_STRUCTURE.map(g=>{
    const lines = [];
    g.classes.forEach(cls=>{
      const row = byClass[cls];
      row.subs.forEach((s,i)=>{
        const p = row.plans[i];
        if(!p || !p.submittedAt){
          const teacher = TEACHER_DIRECTORY[planEntryKey(cls, s)] || '—';
          lines.push({cls, subject:s, teacher});
        }
      });
    });
    if(!lines.length) return '';
    anyMissing = true;
    return `
      <h3 class="print-class-title" style="margin-top:18px;">${g.grade}</h3>
      <table class="print-table">
        <colgroup><col style="width:25%"><col style="width:40%"><col style="width:35%"></colgroup>
        <thead><tr><th>Class</th><th>Subject</th><th>Teacher</th></tr></thead>
        <tbody>
          ${lines.map(l=>`<tr><td>${l.cls}</td><td>${l.subject}</td><td style="text-transform:uppercase;">${escapeHtml(l.teacher)}</td></tr>`).join('')}
        </tbody>
      </table>`;
  }).join('');

  const printArea = document.getElementById('printArea');
  printArea.innerHTML = `
    <div class="print-header">
      <h1>AL NOAIMEYAH GIRLS SCHOOL</h1>
      <p class="print-cycle">CYCLE 1 &nbsp;•&nbsp; CYCLE 2 &nbsp;•&nbsp; CYCLE 3</p>
    </div>
    <h2 class="print-class-title">🚨 Incomplete Weekly Plans</h2>
    <p class="print-sub">${weekLabelText(weekStart)}</p>
    ${anyMissing ? sections : `
      <div class="print-star-box">
        <div class="print-star-title">🎉 ALL PLANS POSTED 🎉</div>
        <div class="print-star-line">Every class and subject is up to date this week!</div>
      </div>`}
  `;
  window.print();
}
async function printClassSchedule(className){
  const subs = subjectsForClass(className);
  const plans = await Promise.all(subs.map(s=>loadPlan(className, s, weekStart)));
  const stars = subs.map((s,i)=>({subject:s, plan:plans[i]}))
    .filter(x=>x.plan && x.plan.submittedAt && x.plan.starOfWeek);
  const printArea = document.getElementById('printArea');
  printArea.innerHTML = `
    <div class="print-header">
      <h1>AL NOAIMEYAH GIRLS SCHOOL</h1>
      <p class="print-cycle">CYCLE 1 &nbsp;•&nbsp; CYCLE 2 &nbsp;•&nbsp; CYCLE 3</p>
    </div>
    <h2 class="print-class-title">${className} — Weekly Plan</h2>
    <p class="print-sub">${weekLabelText(weekStart)}</p>
    ${starBoxHtml(stars)}
    <table class="print-table">
      <colgroup>
        <col style="width:15%">
        ${DAYS.map(()=>'<col style="width:17%">').join('')}
      </colgroup>
      <thead><tr><th>Subject</th>${DAYS.map(([k,l])=>`<th>${l}</th>`).join('')}</tr></thead>
      <tbody>
        ${subs.map((s,i)=>{
          const p = plans[i];
          const posted = p && p.submittedAt;
          return `<tr>
            <td><strong>${s}</strong>${posted && p.teacherName ? `<br><span class="print-teacher">${escapeHtml(p.teacherName)}</span>` : ''}</td>
            ${DAYS.map(([k])=>{
              if(!posted) return `<td class="print-empty">—</td>`;
              const day = p.days[k] || {};
              return `<td dir="auto">${day.topic ? escapeHtml(day.topic) : '—'}${day.homework ? `<br><em>Task/Exam: ${escapeHtml(day.homework)}</em>` : ''}</td>`;
            }).join('')}
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  `;
  window.print();
}

/* ---------- WIRING ---------- */
document.querySelectorAll('nav.roles button').forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll('nav.roles button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    role = btn.dataset.role;
    render();
  };
});
document.getElementById('prevWeek').onclick = ()=>{ weekStart = addDays(weekStart,-7); render(); };
document.getElementById('nextWeek').onclick = ()=>{ weekStart = addDays(weekStart,7); render(); };

/* Lock the view to one role when opened via ?role=teacher / admin / student.
   This hides the role switcher entirely so a student link never shows the
   teacher entry form or the admin dashboard. */
function applyRoleLock(){
  const params = new URLSearchParams(window.location.search);
  const locked = params.get('role');
  if(locked && ['teacher','admin','student'].includes(locked)){
    role = locked;
    document.querySelector('nav.roles').style.display = 'none';
    document.querySelectorAll('nav.roles button').forEach(b=>b.classList.toggle('active', b.dataset.role===locked));
  }
}

(function init(){
  applyRoleLock();
  render();
})();
</script>
